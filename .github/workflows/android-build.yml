name: Android Build

on:
  pull_request:
  push:
    branches: [main, agent/alpha24-production-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GIRVI_TEST_STORE_PASSWORD: ${{ secrets.GIRVI_TEST_STORE_PASSWORD }}
      GIRVI_TEST_KEY_PASSWORD: ${{ secrets.GIRVI_TEST_KEY_PASSWORD }}
      GIRVI_TEST_KEY_ALIAS: ${{ secrets.GIRVI_TEST_KEY_ALIAS }}
      GIRVI_TEST_CERT_SHA256: ${{ secrets.GIRVI_TEST_CERT_SHA256 }}
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply guarded restore wiring
        if: ${{ hashFiles('.alpha24-restore-wiring') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/girvikhata/app/RestoreActivity.kt')
          text = path.read_text()

          def replace(old, new, expected=1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} matches, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          replace(
              '''import com.girvikhata.app.data.RecordStoreLoadState
import com.girvikhata.app.data.VerifiedBusinessMutation
import com.girvikhata.app.data.VerifiedBusinessWriteCoordinator
import com.girvikhata.app.data.VerifiedBusinessWriteRequest
import com.girvikhata.app.data.VerifiedBusinessWriteResult
''',
              '''import com.girvikhata.app.data.RecordStoreLoadState
import com.girvikhata.app.data.RestoreGenerationCoordinator
''',
          )
          replace(
              '        val coordinator = VerifiedBusinessWriteCoordinator(applicationContext)\n',
              '        val restoreCoordinator = RestoreGenerationCoordinator(applicationContext)\n',
          )
          replace(
              '''                        val result = coordinator.execute(
                            VerifiedBusinessWriteRequest(
                                expectedFingerprint = coordinator.currentFingerprint(),
                                mutation = VerifiedBusinessMutation.ReplaceSnapshotForRestore(preview.snapshot),
                                title = "Verified backup restore ${preview.sha256.take(12)}",
                            ),
                        )
                        if (preview.containsPortableMasters) masterStore.save(preview.masterCatalog)

                        store.load().also { reloaded ->
''',
              '''                        val result = restoreCoordinator.restore(
                            targetSnapshot = preview.snapshot,
                            importedMasters = preview.masterCatalog,
                            containsPortableMasters = preview.containsPortableMasters,
                            backupSha256 = preview.sha256,
                        )

                        store.load().also { reloaded ->
''',
          )
          replace(
              '    commitRestore: (RestorePreview, String) -> VerifiedBusinessWriteResult,\n',
              '    commitRestore: (RestorePreview, String) -> RestoreGenerationCoordinator.Result,\n',
              expected=2,
          )
          replace(
              '                            message = "Restore successful • TX ${result.transactionId.take(8)}. Main app dobara check karein."\n',
              '                            message = "Restore successful • Generation ${result.generationId.take(8)}. Main app dobara check karein."\n',
          )

          path.write_text(text)
          Path('.alpha24-restore-wiring').unlink()
          PY

          git config user.name 'alpha24-hardening-bot'
          git config user.email 'alpha24-hardening-bot@users.noreply.github.com'
          git add app/src/main/java/com/girvikhata/app/RestoreActivity.kt .alpha24-restore-wiring
          git commit -m 'feat: wire crash-consistent restore generation'
          git push origin HEAD:agent/alpha24-production-hardening

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager --channel=0 "platforms;android-36" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log

      - name: Verify Android compilation
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs compileDebugKotlin --stacktrace 2>&1 | tee compile-debug.log

      - name: Restore pinned testing signing identity
        shell: bash
        env:
          GIRVI_TEST_KEYSTORE_BASE64: ${{ secrets.GIRVI_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for required in GIRVI_TEST_KEYSTORE_BASE64 GIRVI_TEST_STORE_PASSWORD GIRVI_TEST_KEY_PASSWORD GIRVI_TEST_KEY_ALIAS GIRVI_TEST_CERT_SHA256; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required repository secret is missing. Random/fallback signing is forbidden."
              exit 1
            fi
          done

          SIGNING_DIR="$RUNNER_TEMP/girvi-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE="$SIGNING_DIR/testing.keystore"
          printf '%s' "$GIRVI_TEST_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$GIRVI_TEST_STORE_PASSWORD" \
            -alias "$GIRVI_TEST_KEY_ALIAS" >/dev/null

          ACTUAL_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass "$GIRVI_TEST_STORE_PASSWORD" \
              -alias "$GIRVI_TEST_KEY_ALIAS" \
            | sha256sum | awk '{print tolower($1)}'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$GIRVI_TEST_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "GIRVI_TEST_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Signing certificate verified: $ACTUAL_CERT_SHA256"

      - name: Build debug APK
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs assembleDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ACTUAL_APK_CERT_SHA256="$(
            apksigner verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$GIRVI_TEST_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL_APK_CERT_SHA256"
          if [ "$ACTUAL_APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Built APK certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_APK_CERT_SHA256"
            exit 1
          fi
          echo "APK certificate verified: $ACTUAL_APK_CERT_SHA256"

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: girvi-khata-testing-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            unit-test.log
            compile-debug.log
            apk-build.log
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
