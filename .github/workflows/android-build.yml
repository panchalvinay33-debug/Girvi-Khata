name: Android Build

on:
  pull_request:
  push:
    branches: [main, agent/alpha24-production-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GIRVI_TEST_STORE_PASSWORD: ${{ secrets.GIRVI_TEST_STORE_PASSWORD }}
      GIRVI_TEST_KEY_PASSWORD: ${{ secrets.GIRVI_TEST_KEY_PASSWORD }}
      GIRVI_TEST_KEY_ALIAS: ${{ secrets.GIRVI_TEST_KEY_ALIAS }}
      GIRVI_TEST_CERT_SHA256: ${{ secrets.GIRVI_TEST_CERT_SHA256 }}
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform and build tools
        run: sdkmanager --channel=0 "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log

      - name: Verify Android compilation
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs compileDebugKotlin --stacktrace 2>&1 | tee compile-debug.log

      - name: Restore pinned testing signing identity
        shell: bash
        env:
          GIRVI_TEST_KEYSTORE_BASE64: ${{ secrets.GIRVI_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for required in GIRVI_TEST_KEYSTORE_BASE64 GIRVI_TEST_STORE_PASSWORD GIRVI_TEST_KEY_PASSWORD GIRVI_TEST_KEY_ALIAS GIRVI_TEST_CERT_SHA256; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required repository secret is missing. Random/fallback signing is forbidden."
              exit 1
            fi
          done

          SIGNING_DIR="$RUNNER_TEMP/girvi-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE="$SIGNING_DIR/testing.keystore"
          printf '%s' "$GIRVI_TEST_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$GIRVI_TEST_STORE_PASSWORD" \
            -alias "$GIRVI_TEST_KEY_ALIAS" >/dev/null

          ACTUAL_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass "$GIRVI_TEST_STORE_PASSWORD" \
              -alias "$GIRVI_TEST_KEY_ALIAS" \
            | sha256sum | awk '{print tolower($1)}'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$GIRVI_TEST_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "GIRVI_TEST_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Signing certificate verified: $ACTUAL_CERT_SHA256"

      - name: Build debug APK
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-watch-fs assembleDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x | sort -V | tail -n1)"
          test -f "$APK"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in installed Android build-tools."
            exit 1
          fi

          if ! CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"; then
            printf '%s\n' "$CERT_OUTPUT"
            echo "::error::APK signature verification failed."
            exit 1
          fi

          ACTUAL_APK_CERT_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
            | awk -F': ' 'tolower($1) ~ /certificate sha-256 digest$/ {value=$2; gsub(/:/, "", value); print tolower(value); exit}' \
            | tr -d '[:space:]'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$GIRVI_TEST_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$ACTUAL_APK_CERT_SHA256" ]; then
            echo "::error::APK certificate fingerprint could not be parsed from verified signer output."
            exit 1
          fi
          if [ "$ACTUAL_APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Built APK certificate mismatch. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_APK_CERT_SHA256"
            exit 1
          fi
          echo "APK certificate verified: $ACTUAL_APK_CERT_SHA256"

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: girvi-khata-testing-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            unit-test.log
            compile-debug.log
            apk-build.log
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
